parameters:
  - name: envName       # dev or demo: the image tag and the App Service app names (infra/setup-azure.ps1)
    type: string
  - name: runE2E
    type: boolean
    default: false

steps:
  - checkout: self

  - task: Docker@2
    displayName: 'Log in to ACR'
    inputs:
      containerRegistry: '$(acrServiceConnection)'
      command: 'login'

  # Promote the images built in this run by retagging them :${{ parameters.envName }}, then POST to the app's
  # continuous-deployment webhook so it pulls the tag and restarts. Agent first, so the API never points at an older
  # agent contract. The API applies EF Core migrations on start (Database:AutoMigrate); the idempotent script is also
  # published as the "sql" artifact for DBAs who prefer to apply it by hand.
  - script: |
      set -e
      REG=$(acrName).azurecr.io
      deploy() {
        docker pull $REG/$1:$(Build.BuildId)
        docker tag $REG/$1:$(Build.BuildId) $REG/$1:${{ parameters.envName }}
        docker push $REG/$1:${{ parameters.envName }}
        curl -sS --fail -X POST -d '' "$2" -o /dev/null
        echo "Redeploy requested for $1:${{ parameters.envName }}"
      }
      deploy $(agentImage) "$AGENT_HOOK"
      deploy $(apiImage) "$API_HOOK"
    displayName: 'Deploy agent, then API (retag :${{ parameters.envName }})'
    env:
      AGENT_HOOK: $(cdHook_agent_${{ parameters.envName }})
      API_HOOK: $(cdHook_api_${{ parameters.envName }})

  - script: |
      FQDN=app-tc-api-${{ parameters.envName }}-$(appSuffix).azurewebsites.net
      # Give App Service time to pull the new image and swap containers before checking.
      sleep 120
      check() {
        for i in $(seq 1 20); do
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN$1" || true)
          [ "$code" = "200" ] && echo "OK: $1" && return 0
          sleep 15
        done
        echo "FAILED: $1 returned $code"; curl -s "https://$FQDN$1"; return 1
      }
      check /health
      check /api/health/agent   # proves the API can reach the agent (which only accepts the API's addresses)
      check /api/health/intake  # document storage reachable; mailbox reachable or disabled
      echo "##vso[task.setvariable variable=apiFqdn]$FQDN"
    displayName: 'Smoke test'

  - ${{ if eq(parameters.runE2E, true) }}:
    - task: NodeTool@0
      inputs: { versionSpec: '$(nodeVersion)' }
    - script: |
        npm ci
        npx playwright install --with-deps chromium
        BASE_URL=https://$(apiFqdn) npx playwright test --reporter=junit
      workingDirectory: tests/e2e
      displayName: 'Playwright end-to-end (six-course demo flow)'
      env:
        PLAYWRIGHT_JUNIT_OUTPUT_NAME: $(Build.ArtifactStagingDirectory)/e2e.xml
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/e2e.xml'
